<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open in Papyri</title>
<meta property="og:title" content="Papyri">
<meta property="og:description" content="Discover and discuss research, one paper at a time.">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5; color: #1a1a1a; background: #fff;
    max-width: 520px; margin: 0 auto; padding: 56px 24px; text-align: center;
  }
  h1 { font-size: 28px; margin: 0 0 6px; }
  .what { color: #666; margin: 0 0 24px; }
  .title { font-size: 18px; font-weight: 600; margin: 0 0 28px; }
  .title:empty { display: none; }
  a.btn { display: block; padding: 14px; border-radius: 12px; text-decoration: none; font-weight: 600; margin-bottom: 12px; }
  .open { background: #0a6cff; color: #fff; }
  .store { border: 1px solid #ccc; color: #1a1a1a; }
  .note { color: #888; font-size: 14px; margin-top: 20px; }
  @media (prefers-color-scheme: dark) {
    body { background: #111; color: #eee; }
    .store { color: #eee; border-color: #444; }
  }
</style>
</head>
<body>
<h1>Papyri</h1>
<p class="what" id="what">Discover and discuss research, one paper at a time.</p>
<p class="title" id="title"></p>
<a class="btn open" id="open" href="papyri://">Open in Papyri</a>
<a class="btn store" href="https://apps.apple.com/app/papyri/id6812509741">Get Papyri on the App Store</a>
<p class="note">Don't have the app yet? Get it first, then come back and tap "Open in Papyri".</p>

<script>
  // Links look like open.html?paper=<PubMed ID> or open.html?person=<user id>.
  var q = new URLSearchParams(location.search);
  var paper = q.get('paper'), person = q.get('person');
  var open = document.getElementById('open');
  var what = document.getElementById('what');

  if (paper && /^\d+$/.test(paper)) {
    open.href = 'papyri://paper/' + paper;
    what.textContent = 'A paper shared from Papyri';
    // Shows the paper's title (from Europe PMC). If that fails, the buttons still work.
    fetch('https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID:' + paper + '%20AND%20SRC:MED&format=json')
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var rec = j && j.resultList && j.resultList.result && j.resultList.result[0];
        if (rec && rec.title) document.getElementById('title').textContent = rec.title.replace(/<[^>]+>/g, '');
      })
      .catch(function () {});
  } else if (person && /^[0-9a-f-]{36}$/i.test(person)) {
    open.href = 'papyri://person/' + person;
    what.textContent = "A researcher's profile on Papyri";
  }
</script>
</body>
</html>
